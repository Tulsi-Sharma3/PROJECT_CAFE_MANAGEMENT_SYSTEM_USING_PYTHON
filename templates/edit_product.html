{% extends "base.html" %}

{% block title %}
Edit Product
{% endblock %}

{% block content %}

<h2>Edit Product</h2>

<form method="POST">

<label>Name</label><br>
<input type="text"
       name="product_name"
       value="{{ product.product_name }}"
       required><br><br>

<label>Category</label><br>
<input type="text"
       name="category"
       value="{{ product.category }}"
       required><br><br>

<label>Price</label><br>
<input type="number"
       step="0.01"
       name="price"
       value="{{ product.price }}"
       required><br><br>

<label>Stock</label><br>
<input type="number"
       name="stock"
       value="{{ product.stock }}"
       required><br><br>

<button type="submit">
Update Product
</button>

</form>

{% endblock %}
