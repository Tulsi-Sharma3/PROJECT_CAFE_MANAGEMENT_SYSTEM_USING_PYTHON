{% extends "base.html" %}

{% block title %}
Edit Customer
{% endblock %}

{% block content %}

<h2>Edit Customer</h2>

<form method="POST">

    <label>Name</label><br>
    <input type="text"
           name="customer_name"
           value="{{ customer.customer_name }}"
           required><br><br>

    <label>Phone</label><br>
    <input type="text"
           name="phone"
           value="{{ customer.phone }}"><br><br>

    <label>Email</label><br>
    <input type="email"
           name="email"
           value="{{ customer.email }}"><br><br>

    <button type="submit">
        Update Customer
    </button>

</form>

<br>

<a href="/customers">Back to Customers</a>

{% endblock %}
