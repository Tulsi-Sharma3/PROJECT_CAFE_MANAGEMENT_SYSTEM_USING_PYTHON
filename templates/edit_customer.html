{% extends "base.html" %}

{% block title %}
Edit Customer
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h2>✏️ Edit Customer</h2>
        <p>Update customer information</p>
    </div>

    <a href="/customers" class="primary-button">
        ← Back to Customers
    </a>

</div>


<div class="form-container">

    <form method="POST">

        <label>Customer Name</label>

        <input
            type="text"
            name="customer_name"
            value="{{ customer.customer_name }}"
            required
        >


        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ customer.phone or '' }}"
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ customer.email or '' }}"
        >


        <button
            type="submit"
            class="primary-button">

            💾 Update Customer

        </button>

    </form>

</div>

{% endblock %}
