{% extends "base.html" %}

{% block title %}
Add Customer
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2>👥 Add Customer</h2>
        <p>Add a new cafe customer</p>
    </div>

    <a href="/customers" class="primary-button">
        ← Back to Customers
    </a>
</div>


<div class="form-container">

    <form method="POST">

        <label>Customer Name</label>

        <input
            type="text"
            name="customer_name"
            placeholder="Enter customer name"
            required
        >


        <label>Phone</label>

        <input
            type="text"
            name="phone"
            placeholder="Enter phone number"
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email address"
        >


        <button type="submit" class="primary-button">
            ➕ Add Customer
        </button>

    </form>

</div>

{% endblock %}
