{% extends "base.html" %}

{% block title %}
Add Customer
{% endblock %}

{% block content %}

<h2>Add Customer</h2>

<form method="POST">

<label>Name</label><br>

<label>Email</label><br>
<input type="email" name="email"><br><br>

<button type="submit">Save Customer</button>

</form>

{% endblock %}
